<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Administrador</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Portal de Administración</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login-admin.html">Volver al Inicio de Sesión de Administrador</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Registro de Administrador</h2>
            <form id="register-admin-form">
                <label for="nombre-completo">Nombre Completo:</label>
                <input type="text" id="nombre-completo" name="nombre-completo" required>

                <label for="cedula">Número de Cédula:</label>
                <input type="text" id="cedula" name="cedula" required>

                <label for="password">Clave:</label>
                <input type="password" id="password" name="password" required>

                <label for="confirm-password">Confirmar Clave:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>

                <button type="submit" class="btn">Registrarse como Administrador</button>
            </form>
            <p id="message" class="message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Alquiler de Vehículos. Todos los derechos reservados.</p>
    </footer>

    <script src="js/auth-admin.js" defer></script>
</body>
</html>
