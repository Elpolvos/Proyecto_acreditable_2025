<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empleado - Alquiler de Vehículos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Panel de Empleado</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="logout.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="admin-panel">
            <h2>Acciones del Empleado</h2>
            <div class="panel-buttons">
                <a href="gestion-reservas.html" class="btn">Gestionar Reservas</a>
                <a href="gestion-facturas.html" class="btn">Gestionar Pagos y Facturas</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Alquiler de Vehículos. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));

            // Proteger la página: solo los empleados pueden acceder
            if (!currentUser || currentUser.role !== 'empleado') {
                // Redirigir al login si no es empleado
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
